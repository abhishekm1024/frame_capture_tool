[versions]
agp                    = "8.7.0"
kotlin                 = "2.0.21"
ksp                    = "2.0.21-1.0.28"
composeBom             = "2024.12.01"
hilt                   = "2.52"
hiltAndroidx           = "1.2.0"
cameraX                = "1.4.1"
arcore                 = "1.46.0"
firebaseBom            = "33.7.0"
googleServices         = "4.4.2"
room                   = "2.6.1"
workManager            = "2.10.0"
kotlinxSerialization   = "1.7.3"
navigationCompose      = "2.8.5"
coroutines             = "1.9.0"
lottieCompose          = "6.5.2"
coreKtx                = "1.15.0"
activityCompose        = "1.9.3"
lifecycleVm            = "2.8.7"
junitVersion           = "4.13.2"
androidxTestExt        = "1.2.1"
espresso               = "3.6.1"
turbine                = "1.2.0"
mockk                  = "1.13.13"

[libraries]
# AndroidX Core
core-ktx                     = { group = "androidx.core",                name = "core-ktx",                     version.ref = "coreKtx" }
activity-compose             = { group = "androidx.activity",            name = "activity-compose",             version.ref = "activityCompose" }

# Lifecycle
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleVm" }
lifecycle-runtime-compose    = { group = "androidx.lifecycle",           name = "lifecycle-runtime-compose",    version.ref = "lifecycleVm" }
lifecycle-viewmodel-ktx      = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-ktx",      version.ref = "lifecycleVm" }

# Compose
compose-bom                  = { group = "androidx.compose",             name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                   = { group = "androidx.compose.ui",          name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui",          name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",          name = "ui-tooling-preview" }
compose-ui-tooling           = { group = "androidx.compose.ui",          name = "ui-tooling" }
compose-material3            = { group = "androidx.compose.material3",   name = "material3" }
compose-ui-test-junit4       = { group = "androidx.compose.ui",          name = "ui-test-junit4" }
compose-ui-test-manifest     = { group = "androidx.compose.ui",          name = "ui-test-manifest" }
compose-foundation           = { group = "androidx.compose.foundation",  name = "foundation" }
compose-material-icons-core  = { group = "androidx.compose.material",   name = "material-icons-core" }

# Navigation
navigation-compose           = { group = "androidx.navigation",          name = "navigation-compose",           version.ref = "navigationCompose" }

# Hilt
hilt-android                 = { group = "com.google.dagger",            name = "hilt-android",                 version.ref = "hilt" }
hilt-android-compiler        = { group = "com.google.dagger",            name = "hilt-android-compiler",        version.ref = "hilt" }
hilt-android-testing         = { group = "com.google.dagger",            name = "hilt-android-testing",         version.ref = "hilt" }
hilt-navigation-compose      = { group = "androidx.hilt",                name = "hilt-navigation-compose",      version.ref = "hiltAndroidx" }
hilt-work                    = { group = "androidx.hilt",                name = "hilt-work",                    version.ref = "hiltAndroidx" }
hilt-compiler-androidx       = { group = "androidx.hilt",                name = "hilt-compiler",                version.ref = "hiltAndroidx" }

# CameraX
camerax-core                 = { group = "androidx.camera",              name = "camera-core",                  version.ref = "cameraX" }
camerax-camera2              = { group = "androidx.camera",              name = "camera-camera2",               version.ref = "cameraX" }
camerax-lifecycle            = { group = "androidx.camera",              name = "camera-lifecycle",             version.ref = "cameraX" }
camerax-view                 = { group = "androidx.camera",              name = "camera-view",                  version.ref = "cameraX" }

# ARCore
arcore                       = { group = "com.google.ar",                name = "core",                         version.ref = "arcore" }

# Firebase
firebase-bom                 = { group = "com.google.firebase",          name = "firebase-bom",                 version.ref = "firebaseBom" }
firebase-auth-ktx            = { group = "com.google.firebase",          name = "firebase-auth-ktx" }
firebase-storage-ktx         = { group = "com.google.firebase",          name = "firebase-storage-ktx" }

# Room
room-runtime                 = { group = "androidx.room",                name = "room-runtime",                 version.ref = "room" }
room-ktx                     = { group = "androidx.room",                name = "room-ktx",                     version.ref = "room" }
room-compiler                = { group = "androidx.room",                name = "room-compiler",                version.ref = "room" }
room-testing                 = { group = "androidx.room",                name = "room-testing",                 version.ref = "room" }

# WorkManager
work-runtime-ktx             = { group = "androidx.work",                name = "work-runtime-ktx",             version.ref = "workManager" }
work-testing                 = { group = "androidx.work",                name = "work-testing",                 version.ref = "workManager" }

# Coroutines
coroutines-android           = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android",   version.ref = "coroutines" }
coroutines-test              = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-test",      version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json   = { group = "org.jetbrains.kotlinx",        name = "kotlinx-serialization-json",   version.ref = "kotlinxSerialization" }

# Lottie
lottie-compose               = { group = "com.airbnb.android",           name = "lottie-compose",               version.ref = "lottieCompose" }

# Testing
junit                        = { group = "junit",                        name = "junit",                        version.ref = "junitVersion" }
androidx-test-ext            = { group = "androidx.test.ext",            name = "junit",                        version.ref = "androidxTestExt" }
espresso-core                = { group = "androidx.test.espresso",       name = "espresso-core",                version.ref = "espresso" }
turbine                      = { group = "app.cash.turbine",             name = "turbine",                      version.ref = "turbine" }
mockk                        = { group = "io.mockk",                     name = "mockk",                        version.ref = "mockk" }
mockk-android                = { group = "io.mockk",                     name = "mockk-android",                version.ref = "mockk" }

[plugins]
android-application          = { id = "com.android.application",                          version.ref = "agp" }
android-library              = { id = "com.android.library",                              version.ref = "agp" }
kotlin-android               = { id = "org.jetbrains.kotlin.android",                     version.ref = "kotlin" }
kotlin-compose               = { id = "org.jetbrains.kotlin.plugin.compose",              version.ref = "kotlin" }
kotlinx-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization",        version.ref = "kotlin" }
hilt                         = { id = "com.google.dagger.hilt.android",                   version.ref = "hilt" }
ksp                          = { id = "com.google.devtools.ksp",                          version.ref = "ksp" }
google-services              = { id = "com.google.gms.google-services",                   version.ref = "googleServices" }
